<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0E1014; --bg2:#12151B; --surface:#171B22; --raised:#1F242D; --hover:#262C36;
  --line:#2A3039; --line-soft:#21262E; --ink:#F1F3F6; --ink-2:#AEB6C2; --ink-3:#6E7785;
  --crit:#FF4D52; --crit-bg:#2A1416; --crit-line:#5A2326; --go:#36C26B; --go-bg:#0F2419; --go-line:#1E4A33;
  --info:#54A0FF; --info-bg:#0F1E33; --info-line:#1E3A5C; --radius:14px;
}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0; background:radial-gradient(1000px 500px at 100% -10%, #161B24 0%, transparent 60%), var(--bg);
  color:var(--ink); font-family:"Assistant","Rubik",system-ui,sans-serif; font-size:16px; line-height:1.5; min-height:100vh;
  -webkit-font-smoothing:antialiased; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:560px; margin:0 auto; padding:24px 18px 60px}
.head{display:flex; align-items:center; gap:14px; margin-bottom:8px}
.head img{height:54px; border-radius:10px}
.head h1{font-family:"Rubik"; font-weight:700; font-size:21px; margin:0}
.head .sub{font-size:13px; color:var(--ink-3); margin-top:2px}
.lead{color:var(--ink-2); font-size:14.5px; margin:6px 2px 22px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px}
.fg{display:flex; flex-direction:column; gap:7px; margin-bottom:18px}
.fg label{font-size:14px; font-weight:600; color:var(--ink-2)}
.fg .req{color:var(--crit)}
input,select,textarea{background:var(--bg2); border:1px solid var(--line); color:var(--ink); border-radius:11px;
  padding:13px 14px; outline:none; transition:.15s; width:100%; font-family:inherit; font-size:16px}
input:focus,textarea:focus,.combo-input:focus{border-color:#475063; box-shadow:0 0 0 3px rgba(84,160,255,.12)}
textarea{resize:vertical; min-height:96px}
.mono{font-family:"Space Mono",monospace}
.combo{position:relative}
.combo .combo-input{padding-inline-start:34px}
.combo-caret{position:absolute; inset-inline-start:13px; top:50%; transform:translateY(-50%); color:var(--ink-3); font-size:12px; pointer-events:none}
.combo-pop{position:absolute; top:calc(100% + 5px); inset-inline:0; background:var(--raised); border:1px solid var(--line);
  border-radius:12px; box-shadow:0 18px 40px -16px rgba(0,0,0,.8); max-height:260px; overflow:auto; padding:6px; display:none; z-index:20}
.combo-pop.open{display:block}
.combo-opt{padding:11px 12px; border-radius:9px; cursor:pointer; font-size:15px; display:flex; gap:8px; align-items:center}
.combo-opt:hover,.combo-opt.hl{background:var(--hover)}
.combo-opt .sub{margin-inline-start:auto; font-size:12px; color:var(--ink-3); font-family:"Space Mono"}
.combo-empty{padding:11px; color:var(--ink-3); font-size:13px}
.media-btns{display:flex; gap:10px; flex-wrap:wrap}
.media-btn{flex:1; min-width:140px; display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--bg2); border:1px dashed var(--line); color:var(--ink); border-radius:12px; padding:15px 12px;
  font-weight:600; font-size:15px; cursor:pointer; transition:.15s}
.media-btn:hover{border-color:#475063; background:var(--hover)}
.previews{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:10px; margin-top:12px}
.prev{position:relative; aspect-ratio:1; border-radius:11px; overflow:hidden; border:1px solid var(--line); background:var(--bg2)}
.prev img,.prev video{width:100%; height:100%; object-fit:cover; display:block}
.prev .vid-badge{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:26px; background:rgba(0,0,0,.35)}
.prev .rm{position:absolute; top:5px; inset-inline-start:5px; width:24px; height:24px; border-radius:7px; border:0;
  background:rgba(0,0,0,.6); color:#fff; font-size:14px; cursor:pointer; display:grid; place-items:center}
.btn-primary{width:100%; background:var(--ink); color:#0d0f13; border:0; border-radius:13px; padding:16px;
  font-family:"Rubik"; font-weight:700; font-size:17px; cursor:pointer; transition:.15s; margin-top:6px}
.btn-primary:hover{background:#fff}
.btn-primary:disabled{opacity:.6; cursor:default}
.hint{font-size:12.5px; color:var(--ink-3); margin-top:7px}
.placeholder-note{color:var(--ink-3)}
/* success */
.done{text-align:center; padding:50px 20px}
.done .ic{width:84px; height:84px; border-radius:50%; background:var(--go-bg); border:1px solid var(--go-line);
  color:var(--go); font-size:42px; display:grid; place-items:center; margin:0 auto 18px}
.done h2{font-family:"Rubik"; margin:0 0 8px}
.done p{color:var(--ink-2); margin:0 0 22px}
.btn-ghost{background:var(--raised); border:1px solid var(--line); color:var(--ink); border-radius:12px;
  padding:13px 22px; font-weight:600; font-size:15px; cursor:pointer}
.toast{position:fixed; bottom:20px; inset-inline:0; margin-inline:auto; width:max-content; max-width:90%;
  background:var(--raised); border:1px solid var(--line); padding:12px 20px; border-radius:12px; font-weight:600;
  opacity:0; transition:.25s; transform:translateY(16px); z-index:90}
.toast.show{opacity:1; transform:none}
.toast.err{border-color:var(--crit-line)} .toast.ok{border-color:var(--go-line)}
::placeholder{color:var(--ink-3)}
::-webkit-scrollbar{width:10px} ::-webkit-scrollbar-thumb{background:#2d3440;border-radius:20px;border:3px solid transparent;background-clip:content-box}
</style>

const SUPABASE_URL      = "https://eepyupbiqctolhjedbtl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_R64DcApCcpvxKpQr_b6BsA_EvFyqelB";
const BUCKET = "fault-media";

let sb=null;
try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ console.error(e); }

let vehicles=[], faultTypes=[], formType="", mediaFiles=[];

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function uid(){ return "f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(m,k=""){ const t=document.getElementById('toast'); t.textContent=m; t.className="toast show "+k;
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.className="toast",2800); }
function plateFor(nick){ const v=vehicles.find(v=>v.nick===nick); return v?v.plate:""; }

/* ---- load config (vehicles + types) ---- */
async function loadConfig(){
  if(!sb) return;
  try{
    const { data, error } = await sb.from('app_state').select('value').eq('key','fleet:config').maybeSingle();
    if(error) throw error;
    if(data && data.value){
      vehicles = data.value.vehicles || [];
      faultTypes = data.value.faultTypes || [];
    }
  }catch(e){ console.error("loadConfig", e); toast("טעינת הרשימות נכשלה — נסה/י לרענן","err"); }
}

/* ---- combobox ---- */
function combo(inputId, getItems, onPick, allowFree){
  const input=document.getElementById(inputId);
  const pop=input.parentElement.querySelector('.combo-pop');
  let hi=-1, view=[], searching=false;
  const render=()=>{
    const q = searching ? input.value.trim().toLowerCase() : "";
    const items=getItems();
    view = items.filter(it=> !q || it.label.toLowerCase().includes(q) || (it.sub||"").toLowerCase().includes(q));
    pop.innerHTML = view.length
      ? view.map((it,i)=>`<div class="combo-opt ${i===hi?'hl':''}" data-i="${i}">${esc(it.label)}${it.sub?`<span class="sub">${esc(it.sub)}</span>`:""}</div>`).join("")
      : `<div class="combo-empty">${allowFree?"אין התאמה — אפשר טקסט חופשי":"אין התאמה"}</div>`;
  };
  const open=()=>{ render(); pop.classList.add('open'); };
  const close=()=>{ pop.classList.remove('open'); hi=-1; };
  const choose=it=>{ searching=false; input.value=it.label; onPick(it.value,it.label); close(); };
  input.addEventListener('focus',()=>{ searching=false; hi=-1; open(); input.select(); });
  input.addEventListener('click',()=>{ if(!pop.classList.contains('open')) open(); });
  input.addEventListener('input',()=>{ searching=true; hi=-1; open(); });
  input.addEventListener('keydown',e=>{
    if(!pop.classList.contains('open')&&e.key==="ArrowDown"){ open(); return; }
    if(e.key==="ArrowDown"){ e.preventDefault(); hi=Math.min(view.length-1,hi+1); render(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); hi=Math.max(0,hi-1); render(); }
    else if(e.key==="Enter"){ if(hi>=0&&view[hi]){ e.preventDefault(); choose(view[hi]); } }
    else if(e.key==="Escape"){ close(); }
  });
  pop.addEventListener('mousedown',e=>{ const o=e.target.closest('.combo-opt'); if(!o) return; e.preventDefault(); choose(view[+o.dataset.i]); });
  input.addEventListener('blur',()=>setTimeout(close,150));
}

/* ---- media ---- */
function renderPreviews(){
  const box=document.getElementById('previews');
  box.innerHTML = mediaFiles.map((f,i)=>{
    const url=URL.createObjectURL(f);
    const isVid=f.type.startsWith('video');
    return `<div class="prev">${isVid?`<video src="${url}" muted></video><div class="vid-badge">🎥</div>`:`<img src="${url}">`}<button class="rm" data-i="${i}" title="הסר">✕</button></div>`;
  }).join("");
  box.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{ mediaFiles.splice(+b.dataset.i,1); renderPreviews(); });
}
function addFiles(list){
  for(const f of list){ if(f && (f.type.startsWith('image')||f.type.startsWith('video'))) mediaFiles.push(f); }
  renderPreviews();
}

async function uploadMedia(){
  const urls=[];
  for(const file of mediaFiles){
    const ext=(file.name.split('.').pop()||'dat').toLowerCase();
    const path=`${new Date().toISOString().slice(0,10)}/${uid()}.${ext}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, file, { cacheControl:'3600', upsert:false, contentType:file.type });
    if(error){ throw error; }
    const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
    urls.push({ url:data.publicUrl, type:file.type.startsWith('video')?'video':'image' });
  }
  return urls;
}

/* ---- submit ---- */
async function submit(){
  const veh=document.getElementById('fVehicle').value.trim();
  const desc=document.getElementById('fDesc').value.trim();
  const typeText=document.getElementById('fType').value.trim();
  const tMatch=faultTypes.find(t=>t.name===typeText);
  const typeId=tMatch?tMatch.id:formType;
  if(!veh){ toast("יש לבחור רכב","err"); return; }
  if(!typeId){ toast("יש לבחור סוג תקלה","err"); return; }
  if(!desc){ toast("יש להזין תיאור","err"); return; }
  if(!sb){ toast("אין חיבור לשרת","err"); return; }

  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent = mediaFiles.length? "מעלה ושולח…" : "שולח…";
  try{
    let media=[];
    if(mediaFiles.length) media = await uploadMedia();

    let plate=document.getElementById('fPlate').value.trim() || plateFor(veh);
    const fault={
      id:uid(), vehicle:veh, plate, type:typeId, desc,
      handler:"", driver:document.getElementById('fDriver').value.trim(),
      importance:"norm", status:"open",
      openDate:new Date().toISOString().slice(0,10), closeDate:"", notes:"",
      media, source:"driver"
    };
    // re-fetch latest faults, prepend, write back (minimise clobber window)
    const { data, error } = await sb.from('app_state').select('value').eq('key','fleet:faults').maybeSingle();
    if(error) throw error;
    const faults = (data && Array.isArray(data.value)) ? data.value : [];
    faults.unshift(fault);
    const { error: upErr } = await sb.from('app_state').upsert({ key:'fleet:faults', value:faults });
    if(upErr) throw upErr;
    showDone();
  }catch(e){
    console.error("submit", e);
    toast("השליחה נכשלה — בדוק/י חיבור ונסה/י שוב","err");
    btn.disabled=false; btn.textContent="שליחת הדיווח";
  }
}

function showDone(){
  document.getElementById('app').innerHTML = `
    <div class="done">
      <div class="ic">✓</div>
      <h2>הדיווח נשלח!</h2>
      <p>התקלה התקבלה אצל האחראי. תודה רבה.</p>
      <button class="btn-ghost" onclick="location.reload()">דיווח תקלה נוספת</button>
    </div>`;
}

/* ---- init ---- */
(async function(){
  await loadConfig();
  combo('fVehicle', ()=>vehicles.map(v=>({label:v.nick, value:v.nick, sub:v.plate||""})),
        (val)=>{ const p=plateFor(val); document.getElementById('fPlate').value=p||""; }, true);
  combo('fType', ()=>faultTypes.map(t=>({label:t.name, value:t.id})),
        (val)=>{ formType=val; }, false);

  const fileInput=document.getElementById('fileInput');
  document.getElementById('camBtn').onclick=()=>{ fileInput.setAttribute('capture','environment'); fileInput.value=""; fileInput.click(); };
  document.getElementById('galBtn').onclick=()=>{ fileInput.removeAttribute('capture'); fileInput.value=""; fileInput.click(); };
  fileInput.onchange=()=>addFiles(fileInput.files);
  document.getElementById('submitBtn').onclick=submit;
})();
</script>
